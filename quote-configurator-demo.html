<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工業電腦報價配置器（公開展示版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Industrial spec-sheet: cool steel neutrals, one signal-blue accent, amber = 請詢價/待確認, red = 不相容. Dense table left, sticky summary right. */
  --bg: #f3f5f7; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7b; --line: #d9dfe6;
  --accent: #1f5fa8; --accent-soft: #e5eef8;
  --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b42318; --bad-soft: #fde8e6; --ok: #1d6b3a; --ok-soft: #e3f3e8; --info: #3c4f8a; --info-soft: #e8ecf8;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --panel: #1a2129; --ink: #e4e9ef; --muted: #98a6b5; --line: #2c3743;
    --accent: #6ea8ef; --accent-soft: #1d3047;
    --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #f2867c; --bad-soft: #3b1d1b; --ok: #79c995; --ok-soft: #173023; --info: #a5b6ee; --info-soft: #222b45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2129; --ink: #e4e9ef; --muted: #98a6b5; --line: #2c3743;
  --accent: #6ea8ef; --accent-soft: #1d3047;
  --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #f2867c; --bad-soft: #3b1d1b; --ok: #79c995; --ok-soft: #173023; --info: #a5b6ee; --info-soft: #222b45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
.shell { max-width: 1440px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 32px) 40px; display: grid; gap: 20px; }
.top { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
h1 { margin: 0; font-size: 22px; letter-spacing: .02em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
h2 { margin: 0 0 10px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
h2 .n { font-family: var(--font-num); background: var(--ink); color: var(--panel); border-radius: 4px; padding: 0 7px; font-size: 12px; }
h2 .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
h3 { margin: 0 0 6px; font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.period { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg { border: 0; background: transparent; padding: 6px 14px; }
.seg.on { background: var(--accent); color: #fff; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 12px; display: flex; gap: 8px; align-items: baseline; }
.tab small { color: var(--muted); }
.tab.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.models { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.model { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.model.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mcode { font-family: var(--font-num); font-weight: 600; font-size: 15px; }
.mmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.mfoot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1080px) { .work { grid-template-columns: 1fr; } }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--bg); position: sticky; top: 0; }
tbody th { font-weight: 500; white-space: nowrap; }
.r { text-align: right; }
.row.bad { box-shadow: inset 3px 0 0 var(--bad); }
.row.warn { box-shadow: inset 3px 0 0 var(--warn); }
.row.mva td, .row.mva th { color: var(--muted); }
select { width: 100%; min-width: 260px; max-width: 420px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
select:disabled { color: var(--muted); background: var(--bg); }
.fixed { display: inline-block; padding: 5px 0; font-weight: 500; }
input { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--panel); }
.qty { width: 64px; text-align: right; font-family: var(--font-num); }
.qty.w { width: 84px; }
.manual { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.manual input:first-child { width: 110px; }
.manual input:last-child { flex: 1; min-width: 180px; }
.notes { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 180px; max-width: 340px; }
.note { color: var(--muted); font-size: 12px; white-space: pre-line; }
.note.pend { color: var(--warn); }
.chip { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-bad { background: var(--bad-soft); color: var(--bad); }
.chip-info { background: var(--info-soft); color: var(--info); }
small { color: var(--muted); font-size: 11px; }
.summary { min-width: 0; grid-template-columns: minmax(0, 1fr); position: sticky; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.total { display: grid; gap: 2px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.lbl { font-size: 12px; color: var(--muted); }
.big { font-family: var(--font-num); font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.big.warn { color: var(--warn); }
.partial { font-size: 12px; color: var(--warn); }
.facts { margin: 0; display: grid; gap: 8px; }
.facts div { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: baseline; }
.facts dt { color: var(--muted); font-size: 12px; }
.facts dd { margin: 0; display: grid; min-width: 0; overflow-wrap: anywhere; }
.facts input { width: 80px; }
.problems { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 12px; }
.problems li { padding: 6px 8px; border-radius: 5px; overflow-wrap: anywhere; }
.problems li.bad { background: var(--bad-soft); color: var(--bad); }
.problems li.warn { background: var(--warn-soft); color: var(--warn); }
.allgood { margin: 0; color: var(--ok); font-size: 13px; }
.field { font-size: 12px; color: var(--muted); }
#config-name { width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 8px; }
.actions .primary { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 9px; }
.actions .primary:disabled { opacity: .45; cursor: not-allowed; }
.why { margin: 0; font-size: 12px; color: var(--bad); }
.toast { margin: 0; font-size: 12px; color: var(--ok); }
.saved { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.link { border: 0; background: none; color: var(--accent); padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.empty { margin: 0; padding: 16px; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
tfoot th, tfoot td { border-bottom: 0; }
.strong { font-weight: 600; font-size: 15px; }
.foot { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.role { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.role select { width: auto; min-width: 0; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.row.sel { background: var(--accent-soft); }
.qgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .qgrid { grid-template-columns: 1fr; } }
.form { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.form label { font-size: 12px; color: var(--muted); margin-top: 6px; }
.form select, .form input, .form textarea { width: 100%; min-width: 0; max-width: none; box-sizing: border-box; }
textarea { font: inherit; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--panel); color: inherit; min-height: 52px; }
.qmain { min-width: 0; display: grid; gap: 4px; }
.statusbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.share { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; background: var(--ok-soft); padding: 8px 10px; border-radius: 6px; }
.share code { font-family: var(--font-num); overflow-wrap: anywhere; }
.cust { margin-top: 16px; background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; padding: 20px; display: grid; gap: 12px; max-width: 900px; }
.cust header { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.cust .logo { border: 1px dashed var(--line); padding: 8px 14px; color: var(--muted); font-size: 12px; }
.cust .qt { letter-spacing: .12em; font-size: 20px; }
.csys h3 { margin: 0 0 6px; }
.csys ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.csys li { display: grid; grid-template-columns: 160px minmax(0, 1fr) 50px; gap: 8px; }
.csys li span:first-child { color: var(--muted); }
.ctotal { text-align: right; font-size: 16px; border-top: 2px solid var(--ink); padding-top: 8px; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  input.lead{width:100%;min-width:150px}
.qgrid.one{grid-template-columns:1fr}.upload input{position:absolute;opacity:0;width:1px;height:1px}.upload{display:inline-block;margin:6px 0}
  .upload:focus-within .btn{outline:2px solid #13305c;outline-offset:2px}.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px}
  .tbl th,.tbl td{border-bottom:1px solid #e3e8ef;padding:6px 8px;text-align:left;vertical-align:top}.tbl th{background:#f6f8fb;color:#55657a;font-weight:500}
  .tbl .r{text-align:right}.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}.up{color:#a12622}.down{color:#1d6b3a}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}ul.plain{margin:0;padding-left:18px;font-size:13px}
  .banner.warn{background:#fdf0d9;color:#8a4b00;border-radius:8px;padding:10px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h3{font-size:14px;margin:16px 0 6px;color:#13305c}
  input.lead.bad{border-color:#a12622;background:#fbe9e7}

/* phones and narrow tablets: the page never gets wider than the screen; wide tables scroll sideways in their own box */
.shell { grid-template-columns: minmax(0, 1fr); }
.shell > *, .work > *, .qgrid > *, .panel, .step { min-width: 0; }
.panel { overflow-x: auto; }
.facts dd small { white-space: normal; }
@media (max-width: 720px) {
  .shell { padding: 12px 12px 32px; gap: 14px; }
  .top { align-items: stretch; }
  .nav { flex-wrap: wrap; width: 100%; }
  .nav .seg { flex: 1 1 45%; padding: 8px 6px; font-size: 13px; }
  .period { width: 100%; } .period .seg { flex: 1; }
  .models { grid-template-columns: 1fr 1fr; }
  .tab { padding: 6px 10px; font-size: 13px; }
  .summary { position: static; }
  .two { grid-template-columns: 1fr; }
  h1 { font-size: 19px; }
  .sub { font-size: 12px; }
}
</style>
</head>
<body><div role="note" style="background:#13305c;color:#fff;padding:8px 16px;font:14px/1.5 system-ui,sans-serif;text-align:center">公開展示版 Public demo · 價格僅供參考，以業務正式報價為準 Prices are for reference only; the official quotation from ASUS sales prevails.</div>
<div id="root"></div>
